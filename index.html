<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カウントダウンタイマー</title>
<style>
  body{font-family:sans-serif;text-align:center;margin-top:80px;background:#1a1a2e;color:#eee;}
  h1{font-size:36px;}
  #display{font-size:120px;margin:20px;}
  button{font-size:18px;padding:8px 20px;margin:4px;}
  input{font-size:18px;width:60px;text-align:center;}
</style>
</head>
<body>
<h1>カウントダウンタイマー</h1>
<div><input type="number" id="minutesInput" value="1" min="1" max="60"> 分</div>
<div id="display">01:00</div>
<button id="startBtn">開始</button>
<button id="stopBtn">停止</button>
<button id="resetBtn">リセット</button>
<script>
let seconds = 60;
let timerId = null;

function render(){
  const m = String(Math.floor(seconds/60)).padStart(2,'0');
  const s = String(seconds%60).padStart(2,'0');
  document.getElementById('display').textContent = m + ':' + s;
}

function currentStartSeconds(){
  const minutes = Number(document.getElementById('minutesInput').value) || 1;
  return minutes * 60;
}

document.getElementById('startBtn').onclick = () => {
  if (timerId) return;
  timerId = setInterval(() => {
    if (seconds > 0) { seconds--; render(); }
    else { clearInterval(timerId); timerId = null; }
  }, 1000);
};

document.getElementById('stopBtn').onclick = () => {
  clearInterval(timerId);
  timerId = null;
};

document.getElementById('resetBtn').onclick = () => {
  clearInterval(timerId);
  timerId = null;
  seconds = currentStartSeconds();
  render();
};

document.getElementById('minutesInput').onchange = () => {
  if (!timerId) { seconds = currentStartSeconds(); render(); }
};

render();
</script>
</body>
</html>
